[package]
name = "kv-prefix-guard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Prefix-invariant context partitioning, K-bounded cache breakpoint scheduling, and commit-time multimodal artifact distillation for LLM KV-caches."
keywords = ["llm", "kv-cache", "prefix-caching", "context-compression", "wasm"]
categories = ["algorithms", "caching", "text-processing", "wasm"]
readme = "../../README.md"

[lib]
name = "kv_prefix_guard"
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }
