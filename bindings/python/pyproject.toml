[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "kv-prefix-guard"
version = "1.0.0"
description = "Prefix-invariant context partitioning, K-bounded cache breakpoint scheduling, and commit-time relational artifact distillation for LLM KV-caches."
readme = "../../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "David Charles Michael", email = "davidchar@gmail.com" }]
keywords = ["llm", "kv-cache", "prefix-caching", "agents", "context-compression"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
]
