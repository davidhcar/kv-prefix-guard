[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "kv-prefix-guard"
version = "1.0.0"
description = "Context engineering, prefix-invariant KV-cache partitioning, K-bounded prompt caching breakpoint scheduler, and commit-time artifact distillation for multi-turn AI agents and MCP gateways (86.2% token reduction, 95.4% cache hit rate, 6.74x lower prefill cost across Anthropic Claude, OpenAI, Google Gemini, vLLM, and SGLang)"
readme = "../../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "David Charles Michael", email = "davidchar@gmail.com" }]
maintainers = [{ name = "David Charles Michael", email = "davidchar@gmail.com" }]
keywords = [
  "llm",
  "context-engineering",
  "kv-cache",
  "prefix-caching",
  "prompt-caching",
  "context-compression",
  "prompt-compression",
  "context-compaction",
  "context-window",
  "long-context",
  "agent-memory",
  "conversation-memory",
  "chat-history",
  "memory-compaction",
  "cache-control",
  "ephemeral-cache",
  "anthropic",
  "claude",
  "claude-code",
  "openai",
  "gemini",
  "context-caching",
  "vllm",
  "sglang",
  "llama",
  "deepseek",
  "qwen",
  "pagedattention",
  "radixattention",
  "llmlingua",
  "selective-context",
  "snapkv",
  "mcp",
  "model-context-protocol",
  "mcp-server",
  "mcp-client",
  "tool-calling",
  "function-calling",
  "reasoning-models",
  "thinking-tokens",
  "scratchpad",
  "chain-of-thought",
  "coding-agent",
  "swe-agent",
  "cursor",
  "windsurf",
  "openhands",
  "smolagents",
  "pydantic-ai",
  "dspy",
  "litellm",
  "openrouter",
  "langchain",
  "llamaindex",
  "langgraph",
  "autogen",
  "crewai",
  "semantic-kernel",
  "haystack",
  "ai-agents",
  "agentic-workflows",
  "multi-turn",
  "rag",
  "agentic-rag",
  "ast-skeleton",
  "code-skeleton",
  "token-optimization",
  "llm-cost-optimization",
  "ttft",
  "prefill-latency",
  "inference-optimization",
  "llm-gateway",
  "ai-gateway",
  "rust",
  "pyo3",
  "wasm"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed"
]

[project.urls]
Homepage = "https://github.com/davidhcar/kv-prefix-guard"
Repository = "https://github.com/davidhcar/kv-prefix-guard"
Documentation = "https://docs.rs/kv-prefix-guard"
"Bug Tracker" = "https://github.com/davidhcar/kv-prefix-guard/issues"
"Author ORCID" = "https://orcid.org/0009-0007-8679-6941"

[tool.maturin]
module-name = "kv_prefix_guard"
bindings = "pyo3"
strip = true
